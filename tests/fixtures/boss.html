<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px sans-serif;padding:24px}.job-card-box{padding:12px;border-bottom:1px solid #ddd}button,a{margin:8px}.nav-figure{padding:10px}.message-item{padding:10px}textarea{display:block;width:300px}</style></head><body><script>
const list = [
 {id:'existing',title:'测试岗位 已沟通',company:'夹具公司'},
 {id:'one',title:'测试岗位 1',company:'夹具公司'},
 {id:'two',title:'测试岗位 2',company:'夹具公司'},
];
if(localStorage.getItem('fixture-third'))list.push({id:'three',title:'测试岗位 3',company:'夹具公司'});
if(localStorage.getItem('fixture-simple'))list.push({id:'simple-a',title:'固定招呼岗位 A',company:'夹具公司'},{id:'simple-b',title:'固定招呼岗位 B',company:'夹具公司'});
if(localStorage.getItem('fixture-ai'))list.push({id:'ai-reject',title:'AI 不匹配岗位',company:'夹具公司'},{id:'ai-match',title:'AI 匹配岗位',company:'夹具公司'},{id:'ai-error',title:'AI 重试岗位',company:'夹具公司'});
const header = '<nav><a ka="header-username" href="/web/geek/recommend">夹具账号（非真实登录）</a><a href="/web/geek/chat">消息</a></nav>';
function current(){return [...list,{id:'three',title:'测试岗位 3',company:'夹具公司'}].find(j=>j.id===localStorage.getItem('fixture-current'))||list[1]}
function count(key){localStorage.setItem(key,String(Number(localStorage.getItem(key)||0)+1))}
function detail(job){document.getElementById('detail').innerHTML='<h2>'+job.title+'</h2><div class="job-detail-body"><p class="desc">React 和 TypeScript，岗位要求：'+job.title+'</p></div><a class="more-job-btn" href="/job_detail/'+job.id+'.html">查看更多信息</a><a class="op-btn-chat" href="javascript:;">'+(job.id==='existing'||localStorage.getItem('fixture-contact-'+job.id)?'继续沟通':'立即沟通')+'</a>';document.querySelector('.op-btn-chat').onclick=()=>{localStorage.setItem('fixture-current',job.id);if(job.id==='existing'||localStorage.getItem('fixture-contact-'+job.id)){location.href='/web/geek/chat';return}count('fixture-contact-'+job.id);const show=()=>{document.body.insertAdjacentHTML('beforeend','<div role="dialog"><h2>已向BOSS发送消息</h2><a class="default-btn sure-btn">继续沟通</a><button id="stay">留在此页</button></div>');document.querySelector('.sure-btn').onclick=()=>location.href='/web/geek/chat';document.getElementById('stay').onclick=()=>document.querySelector('[role="dialog"]').remove()};job.id==='three'?setTimeout(show,700):show()}}
function jobs(){document.body.innerHTML=header+'<ul>'+list.map(j=>'<li class="job-card-box"><a class="job-name" href="/job_detail/'+j.id+'.html">'+j.title+'</a><span class="boss-name">'+j.company+'</span><span class="job-salary">20-30K</span><span class="company-location">成都</span></li>').join('')+'</ul><section id="detail"></section>';for(const a of document.querySelectorAll('a.job-name'))a.onclick=e=>{e.preventDefault();detail(list.find(j=>a.pathname.includes(j.id+'.html')))};detail(list[0])}
function chat(){const job=current();document.body.innerHTML=header+'<section class="chat-conversation"><h2>'+job.title+'</h2><h3>'+job.company+'</h3><div class="chat-message"><ul class="im-list"><li class="message-item item-myself"><span class="status-delivery">送达</span><p>测试默认招呼语</p></li></ul></div><div class="toolbar-btn '+(job.id==='one'?'unable':'')+'" aria-label="双方回复后可用">发简历</div><textarea id="chat-input"></textarea><button type="send" class="btn-send disabled">发送</button></section>';const editor=document.getElementById('chat-input'),send=document.querySelector('.btn-send');editor.oninput=()=>send.classList.toggle('disabled',!editor.value);send.onclick=()=>{if(!editor.value)return;count('fixture-message-'+job.id);const li=document.createElement('li');li.className='message-item item-myself';const status=document.createElement('span');status.className='status-delivery';status.innerText='送达';const p=document.createElement('p');p.innerText=editor.value;li.append(status,p);document.querySelector('.im-list').append(li);editor.value=''};document.querySelector('.toolbar-btn').onclick=()=>{count('fixture-resume-click-'+job.id);if(job.id==='one')return;document.body.insertAdjacentHTML('beforeend','<div role="dialog"><p>发送附件简历：测试简历.pdf</p><button id="confirm-resume">发送</button></div>');document.getElementById('confirm-resume').onclick=()=>{count('fixture-resume-'+job.id);document.querySelector('.im-list').insertAdjacentHTML('beforeend','<li class="message-item item-myself">附件简历已发送</li>');document.querySelector('[role="dialog"]').remove()}}}
if(!localStorage.getItem('fixture-session')){document.body.innerHTML='<button class="header-login-btn" id="login">测试夹具：登录</button>';document.getElementById('login').onclick=()=>{document.cookie='mvp_fixture_session=persist-check; Secure; SameSite=Lax; Path=/';localStorage.setItem('fixture-session','yes');jobs()}}
else if(location.pathname.includes('security.html'))document.body.innerHTML='<h1>请完成安全验证</h1>';
else if(location.pathname.includes('/chat'))chat();else jobs();
</script></body></html>
