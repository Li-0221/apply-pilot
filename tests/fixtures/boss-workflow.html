<!doctype html><html><meta charset="utf-8"><style>body{font:16px sans-serif;padding:24px}.job-card-box{padding:12px;min-height:200px}button,a{display:inline-block;margin:8px}#chat-input{display:block;border:1px solid;width:400px;min-height:60px}.message-item{padding:8px}</style><body><script>
const params = new URLSearchParams(location.search), phase = localStorage.getItem('phase') || 'batch';
const create = (id, hrActivity = '今日活跃') => ({id,title:'前端 '+id,company:'公司 '+id,hr:'HR '+id,hrActivity});
let list = phase === 'batch' ? [create('stale','30天前活跃'),create('unknown',''),create('blocked'),create('recruiter'),create('role'),create('active-a')] : phase === 'recover' ? [create('recover-a'),create('recover-b')] : [create('pending')];
if(phase==='batch' && params.get('query')==='React')list=[create('active-c')];
if(phase==='batch' && params.get('city')==='101020100')list=[create('active-d')];
const header = '<nav><a ka="header-username">测试账号</a><a href="/web/geek/chat">消息</a></nav>';
const count = key => localStorage.setItem(key,String(Number(localStorage.getItem(key)||0)+1));
function cards(jobs){return jobs.map(j=>'<li class="job-card-box"><a class="job-name" href="/job_detail/'+j.id+'.html">'+j.title+'</a><span class="company-name">'+j.company+'</span><span class="job-area">成都</span><span class="salary">20-30K</span><a href="/boss/'+j.id+'.html">HR</a><div class="boss-info"><span class="boss-name">'+j.hr+'</span><span class="boss-active-time">'+j.hrActivity+'</span></div></li>').join('')}
function jobs(){document.body.innerHTML=header+'<ul>'+cards(list)+'</ul>';if(phase==='batch'&&params.get('query')!=='React'&&params.get('city')!=='101020100'){addEventListener('scroll',()=>{if(!document.querySelector('[data-more]'))document.querySelector('ul').insertAdjacentHTML('beforeend','<div data-more>'+cards([create('active-b')])+'</div>')},{once:true});const ul=document.querySelector('ul');ul.style.minHeight='1500px';ul.insertAdjacentHTML('beforeend','<div style="height:800px"></div>')}}
function conversation(job, inline=false){
 const markup='<section class="'+(inline?'chat-container':'chat-conversation')+'"><h2>'+job.title+'</h2><h3>'+job.company+'有限公司</h3><div class="chat-message"><ul class="im-list"><li class="message-item item-myself"><div class="message-content">定制测试消息</div></li><li class="message-item item-myself">附件简历已发送</li></ul></div><div class="toolbar-btn">发简历</div><div id="chat-input" contenteditable="true"></div><button class="btn-send disabled">发送</button></section>';
 if(inline)document.body.insertAdjacentHTML('beforeend',markup);else document.body.innerHTML=header+markup;
 const editor=document.getElementById('chat-input'),send=document.querySelector('.btn-send');editor.oninput=()=>send.classList.toggle('disabled',!editor.innerText.trim());
 send.onclick=()=>{if(!editor.innerText.trim())return;count('message-'+job.id);const e=document.createElement('li');e.className='message-item item-myself';const content=document.createElement('div');content.className='message-content';content.textContent=editor.innerText;e.append(content);e.insertAdjacentHTML('beforeend','<i class="status-sending"></i>');document.querySelector('.im-list').append(e);editor.innerText='';if(job.id!=='pending')setTimeout(()=>e.querySelector('i').remove(),350)};
 document.querySelector('.toolbar-btn').onclick=()=>{count('resume-'+job.id);document.querySelector('.im-list').insertAdjacentHTML('beforeend','<li class="message-item item-myself">附件简历已发送</li>')};
}
function detail(job){document.body.innerHTML=header+'<h1>'+job.title+'</h1><div>'+job.company+'</div><div class="boss-info"><span class="boss-name">'+job.hr+'</span><span class="boss-active-time">'+job.hrActivity+'</span><a href="/boss/'+job.id+'.html">招聘者</a></div><div class="job-sec-text">完整岗位要求：React、TypeScript。'+job.id+'</div><a class="btn-startchat">'+(localStorage.getItem('contact-'+job.id)?'继续沟通':'立即沟通')+'</a>';document.querySelector('.btn-startchat').onclick=()=>{count('contact-'+job.id);if(job.id==='active-c')conversation(job,true);else window.open('/web/geek/chat?jobId='+job.id,'_blank')}}
const id=location.pathname.match(/\/job_detail\/([^/]+)\.html/)?.[1];
if(location.pathname.includes('/chat'))conversation(create(params.get('jobId')||'active-a'));
else if(id)detail([...list,create('active-b'),create('active-c'),create('active-d')].find(j=>j.id===id)||create(id));else jobs();
</script></body></html>
